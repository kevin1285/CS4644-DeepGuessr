# DeepGuessr config — baselines on Apple Silicon (M-series)
# All paths are relative to the repo root unless absolute.

seed: 42
device: mps            # mps | cuda | cpu

paths:
  data_dir: deepguessr/data
  results_dir: deepguessr/results
  figures_dir: deepguessr/figures
  raw_dir: deepguessr/data/raw          # downloaded shards + extracted images
  images_dir: deepguessr/data/images    # unzipped {id}.jpg live here (train/ test/)

dataset:
  repo_id: osv5m/osv5m
  repo_type: dataset
  id_col: id
  lat_col: latitude
  lon_col: longitude
  country_col: country

download:
  # Final (ICE) scale. Each shard ~2.5 GB zipped; 4 shards ~ 200k raw images.
  train_shards: [0, 1, 2, 3]  # ~10 GB zips -> re-unzip in scratch
  test_shards: [0]            # one test shard (~2.25 GB)
  target_train_images: 200000 # use all downloaded images
  test_subset_size: 10000     # fixed seeded test subset used by EVERY model
  delete_zip_after_unzip: true  # save scratch space at scale

subsets:
  val_frac: 0.05              # val = 5% of downloaded train (seeded)

clip:
  model: ViT-L-14-quickgelu   # upgraded backbone; quickgelu matches OpenAI weights
  pretrained: openai
  image_size: 224
  batch_size: 64
  num_workers: 4

regression:
  hidden: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  epochs: 30
  loss: haversine            # haversine | unitvec_mse

zeroshot:
  prompt_templates:
    - "a street view photo in {country}."
    - "a photo taken in {country}."
    - "a Google Street View image from {country}."
    - "a street in {country}."

metrics:
  thresholds_km: [25, 200, 750, 2500]

geocells:
  tag: default
  max_per_cell: 150           # finer cells (more K) -> better fine-scale accuracy
  min_per_cell: 20
  min_cell_side: 0.25         # degrees; allow smaller cells in dense regions

geocell_head:
  arch: linear                # linear | mlp
  hidden: 1024
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  epochs: 30
  tau_km: 75                  # smoothing temperature for smoothed labels

lora:
  hf_vision_model: openai/clip-vit-large-patch14  # WithProjection: 768-d, matches open_clip L/14
  rank: 32
  alpha: 64
  dropout: 0.1
  target_modules: [q_proj, v_proj]
  head_arch: mlp             # mlp | linear  (match the best frozen head)
  head_hidden: 1024
  warm_start: true           # load the frozen head weights if available
  train_images: 200000        # use all downloaded images
  epochs: 10
  batch_size: 64             # L/14 is ~300M params; smaller batch for memory
  grad_accum: 2              # effective batch 128
  lr_lora: 1.0e-4            # encoder LoRA params
  lr_head: 1.0e-3            # geocell head
  weight_decay: 0.01
  labels: smooth             # onehot | smooth
  num_workers: 8
